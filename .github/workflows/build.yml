name: Build/Verify/Publish MR/Release

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  precheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run detekt
        run: |
          cd Kuroba
          chmod +x ./gradlew
          ./gradlew detekt

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run unit-tests
        run: |
          cd Kuroba
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m"

  # Signed Play-style releases need KEYSTORE / PAT repo secrets and a
  # commit message starting with [beta] or [stable]. Sharter sideloads
  # via the Publish debug APK workflow instead; skip these on normal pushes
  # so missing keystore secrets do not fail the whole run.
  publish-beta:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, '[beta]')
    needs: [precheck, unit-test]
    uses: ./.github/workflows/build-setup.yml
    with:
      publish-type: beta
    secrets: inherit

  publish-stable:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, '[stable]')
    needs: [precheck, unit-test]
    uses: ./.github/workflows/build-setup.yml
    with:
      publish-type: stable
    secrets: inherit

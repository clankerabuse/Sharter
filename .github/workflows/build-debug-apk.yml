name: Build debug APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]

# Releases need write so the APK is a normal GitHub download, not an
# Actions artifact zip (those 404 in the browser on private repos).
permissions:
  contents: write

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools platforms;android-36 build-tools;36.0.0

      - name: Assemble debug APK
        run: |
          cd Kuroba
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug -PbuildType=2 --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m"

      - name: Publish debug APK release
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-apk
          name: Sharter debug APK
          prerelease: true
          make_latest: false
          files: |
            Kuroba/app/build/outputs/apk/debug/Sharter-dev-arm64-v8a.apk
            Kuroba/app/build/outputs/apk/debug/Sharter-dev.apk
          body: |
            Sideload **Sharter-dev-arm64-v8a.apk** on a modern phone.
            `Sharter-dev.apk` is a universal fallback.
            Debug-signed as `com.sharter.android`. Uninstall any other Sharter build first if install is blocked.
